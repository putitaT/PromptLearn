openapi: 3.0.3
info:
  title: PromptLearn Backend API
  version: 1.0.0
  description: |
    Local demo API for building, scheduling, and publishing one English mathematics syllabus per semester.
    Curriculum references come from the supplied OBEC mathematics PDF. Select one or more curriculum row IDs,
    generate a draft, then preview or save the teacher's edited plan. The published endpoint returns the latest
    published snapshot. This demo is designed for a trusted local environment. Response examples abbreviate
    document_html for readability.
    Assignment review accepts OCR evidence for one assignment item and returns guided questions with the original OCR bounds.
    Video Replay provides a local demo for uploading an MP4, generating a transcript with gpt-transcribe,
    publishing it, and playing the published MP4 through the Go backend.
servers:
  - url: http://127.0.0.1:8080
    description: Local Go service
tags:
  - name: Service
  - name: Curriculum
  - name: Syllabus
  - name: Timetable
  - name: Student View
  - name: Assignment Review
  - name: Assessment Rubrics
  - name: Video Replay
paths:
  /healthz:
    get:
      tags: [Service]
      operationId: getHealth
      summary: Check that the HTTP service is running
      responses:
        '200':
          description: Service is reachable
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [ok]}
              examples:
                healthy:
                  $ref: '#/components/examples/Health'

  /v1/curriculum/math:
    get:
      tags: [Curriculum]
      operationId: getMathCurriculum
      summary: List the OBEC mathematics curriculum by grade and course type
      description: |
        Returns the original Thai curriculum text. Select row IDs from groups[].rows[].id.
        A row can contain multiple indicators or outcomes that share one topic.
      parameters:
        - name: grade
          in: query
          required: true
          description: Matthayom grade. Core supports 1–6 and additional supports 4–6.
          schema:
            $ref: '#/components/schemas/Grade'
          example: 6
        - name: course_type
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/CourseType'
          example: core
      responses:
        '200':
          description: Curriculum groups and their source rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurriculumSelection'
              examples:
                grade6:
                  $ref: '#/components/examples/MathCurriculum'
        '400':
          description: Invalid grade or unsupported grade and course-type combination
          content:
            text/plain:
              schema: {type: string}
              examples:
                invalidGrade:
                  $ref: '#/components/examples/InvalidGrade'
                unsupportedCourse:
                  $ref: '#/components/examples/UnsupportedCourse'
        '500':
          description: Curriculum could not be loaded
          content:
            text/plain:
              schema: {type: string}
              example: "curriculum unavailable\n"

  /v1/syllabi/draft:
    post:
      tags: [Syllabus]
      operationId: generateSyllabusDraft
      summary: Generate a one-semester syllabus draft
      description: |
        Uses the server's OpenAI or local curriculum planner. Omit assessment_weights or send an empty
        list to plan units and periods before assigning scores. This operation does not save the draft.
        Maximum request body size is 64 KiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyllabusInput'
            examples:
              beforeScoring:
                $ref: '#/components/examples/DraftInput'
      responses:
        '200':
          description: Generated syllabus with English references and student-facing HTML
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyllabusDraft'
              examples:
                localPlanner:
                  $ref: '#/components/examples/GeneratedDraft'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '502':
          description: Planner failed or returned a plan that violates the input constraints
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
              examples:
                rejectedPlan:
                  value:
                    code: invalid_plan
                    message: the generated plan did not match the curriculum, sessions or scoring requirements
                plannerFailure:
                  value:
                    code: generation_failed
                    message: syllabus generation failed
        '503':
          description: The generator is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
              example: {code: syllabus_unavailable, message: syllabus generation is not configured}
        '504':
          description: The model request timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
              example: {code: model_timeout, message: syllabus generation timed out}

  /v1/timetable/availability:
    post:
      tags: [Timetable]
      operationId: countTeachingPeriods
      summary: Count available teaching periods for each class
      description: The course-wide count is the lowest available-period count across its classes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilityInput'
            examples:
              mondayClass:
                $ref: '#/components/examples/AvailabilityInput'
      responses:
        '200':
          description: Course-wide and per-class period counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'
              examples:
                twoPeriods:
                  $ref: '#/components/examples/Availability'
        '400':
          description: Malformed JSON or an invalid timetable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
              examples:
                invalidJson:
                  value: {code: invalid_json, message: expected one JSON object with known fields}
                invalidDateRange:
                  value:
                    code: invalid_input
                    message: 'invalid timetable: use a date range shorter than one year'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '500':
          $ref: '#/components/responses/CourseFailed'

  /v1/syllabi/preview:
    post:
      tags: [Syllabus]
      operationId: previewSyllabus
      summary: Validate an edited plan and preview the syllabus
      description: |
        When timetable is included, the server assigns periods to the classes' available slots.
        Use the same request body to save the preview. This operation does not call the model or save a draft.
      requestBody:
        $ref: '#/components/requestBodies/SyllabusEdit'
      responses:
        '200':
          description: Validated syllabus and optional schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyllabusPreview'
              examples:
                withSchedule:
                  $ref: '#/components/examples/SyllabusPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '500':
          $ref: '#/components/responses/CourseFailed'

  /v1/syllabi:
    post:
      tags: [Syllabus]
      operationId: createSyllabus
      summary: Save a new syllabus draft
      requestBody:
        $ref: '#/components/requestBodies/SyllabusEdit'
      responses:
        '201':
          description: Draft created
          headers:
            Location:
              description: Relative URL of the saved draft
              schema: {type: string}
              example: /v1/syllabi/11112222333344445555666677778888
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedSyllabus'
              examples:
                savedDraft:
                  $ref: '#/components/examples/SavedDraft'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '500':
          $ref: '#/components/responses/CourseFailed'

  /v1/syllabi/{id}:
    parameters:
      - $ref: '#/components/parameters/SyllabusId'
    get:
      tags: [Syllabus]
      operationId: getSyllabus
      summary: Read the latest saved teacher draft
      responses:
        '200':
          description: Current saved draft, including any edits since publication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedSyllabus'
              examples:
                savedDraft:
                  $ref: '#/components/examples/SavedDraft'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/CourseFailed'
    put:
      tags: [Syllabus]
      operationId: replaceSyllabus
      summary: Replace the saved draft
      description: |
        Send the complete edited plan. For a previously published syllabus, the status becomes
        unpublished_changes and the student view continues to serve the last published snapshot.
      requestBody:
        $ref: '#/components/requestBodies/SyllabusEdit'
      responses:
        '200':
          description: Updated draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedSyllabus'
              examples:
                editedAfterPublication:
                  $ref: '#/components/examples/UpdatedDraft'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '500':
          $ref: '#/components/responses/CourseFailed'

  /v1/syllabi/{id}/publish:
    parameters:
      - $ref: '#/components/parameters/SyllabusId'
    post:
      tags: [Syllabus]
      operationId: publishSyllabus
      summary: Publish the saved draft for students
      description: Publishes the current saved draft. Send an empty request body. Publication requires a complete schedule and 100 assessment points.
      responses:
        '200':
          description: Draft published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedSyllabus'
              examples:
                published:
                  $ref: '#/components/examples/PublishedDraft'
        '400':
          description: Teaching dates fall outside the configured academic term in PostgreSQL mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
              example:
                code: invalid_input
                message: 'invalid timetable: teaching dates are outside the configured academic term'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The draft is missing a complete schedule or a prior teaching session has started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
              examples:
                notReady:
                  $ref: '#/components/examples/NotReady'
                teachingStarted:
                  value:
                    code: teaching_started
                    message: an earlier syllabus version already has a started teaching session
        '500':
          $ref: '#/components/responses/CourseFailed'

  /v1/published-syllabi/{id}:
    parameters:
      - $ref: '#/components/parameters/SyllabusId'
    get:
      tags: [Student View]
      operationId: getPublishedSyllabus
      summary: Read the published student view
      responses:
        '200':
          description: Course details, assessment weights, and teaching schedule from the latest publication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentSyllabus'
              examples:
                studentView:
                  $ref: '#/components/examples/StudentSyllabus'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/CourseFailed'

  /v1/assignments/{assignment_id}/items/{item_id}/reviews:
    post:
      tags: [Assignment Review]
      operationId: reviewAssignmentWork
      summary: Check the student's reasoning on one assignment item
      description: |
        Local demo for HW 3.1 (q1, q2, q3, q5) and the original HW 3.2 example (q4). The backend loads the private question and rubric.
        Flutter sends the full paper PNG as a Base64 data URL. In OpenAI mode, if the client omits OCR blocks, the backend measures ink rows on the original image and transcribes them.
        The image-only path is designed for dark handwriting on the light Flutter notebook with rows in one column.
        Clients that already perform OCR can send positioned blocks in reading order and the same image used to find their boxes.
        Use issue boxes as fractions of the full image, measured from the top-left corner. The response does not include an annotated image.
        The request body limit is 5 MiB. Each completed review is saved as feedback on the in-progress attempt.
      parameters:
        - name: assignment_id
          in: path
          required: true
          schema: {type: string}
          example: hw-3-2
        - name: item_id
          in: path
          required: true
          schema: {type: string}
          example: q4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentReviewInput'
            examples:
              paperWork:
                $ref: '#/components/examples/AssignmentReviewInput'
              imageOnly:
                $ref: '#/components/examples/AssignmentReviewImageOnly'
      responses:
        '200':
          description: Saved review result with its review ID and optional OCR highlights
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentReview'
              examples:
                needsRevision:
                  $ref: '#/components/examples/AssignmentReviewNeedsRevision'
                correct:
                  $ref: '#/components/examples/AssignmentReviewCorrect'
                unreadable:
                  $ref: '#/components/examples/AssignmentReviewUnreadable'
        '400':
          description: Invalid JSON, OCR coordinates, language, focus, or image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
              example:
                code: invalid_input
                message: 'invalid work submission: focused_block_id must match a submitted OCR block'
        '403':
          description: Review demo received a non-loopback peer or host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
              example: {code: forbidden, message: the review demo is available on this machine only}
        '404':
          description: The assignment and item could not be resolved together
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
              example: {code: item_not_found, message: assignment item not found}
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '409':
          description: The student's demo attempt was already submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
              example: {code: attempt_closed, message: this assignment attempt has already been submitted}
        '415':
          description: Request Content-Type is not application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
              example: {code: unsupported_media_type, message: send application/json}
        '502':
          description: The reviewer or OCR failed, or the findings could not be anchored to OCR blocks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
              examples:
                invalidReview:
                  value: {code: invalid_review, message: review could not be matched to the submitted work}
                reviewerFailure:
                  value: {code: review_failed, message: assignment review failed}
        '503':
          description: Feedback storage failed and the review was not saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
              example: {code: feedback_unavailable, message: review feedback could not be saved}
        '504':
          description: The reviewer request timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
              example: {code: review_timeout, message: assignment review timed out}

  /v1/assignments/{assignment_id}/submissions:
    post:
      tags: [Assignment Review]
      operationId: submitReviewedHomework
      summary: Save the results of a completed homework submission
      description: |
        HW 3.1 requires one saved review per question (q1, q2, q3, and q5). The item q5 is displayed as question 4. Go resolves the reviews for the demo student,
        calculates a formative score, and saves the selected answers and their mistakes as a report.
        An unreadable answer has null awarded points and remains pending. Repeating the same set of
        review IDs returns the same saved report.
      parameters:
        - name: assignment_id
          in: path
          required: true
          schema: {type: string, enum: [hw-3-1]}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [review_ids]
              properties:
                review_ids:
                  type: array
                  minItems: 4
                  maxItems: 4
                  uniqueItems: true
                  items: {type: string}
            example:
              review_ids: [review-q1, review-q2, review-q3, review-q5]
      responses:
        '201':
          description: Formative report saved with question scores and highlighted mistakes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeworkSubmissionReport'
              example:
                id: report-example
                assignment_id: hw-3-1
                submitted_at: '2026-11-21T07:45:00Z'
                points: 2
                max_points: 4
                pending: 1
                questions:
                  - {position: 1, item_id: q1, review_id: review-q1, prompt: 'Simplify x² · x³.', recognized_work: 'x^(2+3) = x^5', status: correct, message: 'Your work is correct.', awarded_points: 1, max_points: 1}
                  - {position: 2, item_id: q2, review_id: review-q2, prompt: 'Simplify (a³)².', recognized_work: 'a^(3·2) = a^6', status: correct, message: 'Your work is correct.', awarded_points: 1, max_points: 1}
                  - {position: 3, item_id: q3, review_id: review-q3, prompt: 'Simplify y⁶ ÷ y², where y ≠ 0.', recognized_work: '', status: unreadable, message: 'The work could not be read confidently.', awarded_points: null, max_points: 1}
                  - {position: 4, item_id: q5, review_id: review-q5, prompt: 'Solve for x: x + 7 = 22.', recognized_work: 'x = 22 + 7', status: needs_revision, message: 'Take another look at the highlighted step.', awarded_points: 0, max_points: 1}
                mistakes:
                  - position: 4
                    work: 'x = 22 + 7'
                    block_id: line-2
                    box: {x: 0.075, y: 0.39, width: 0.3, height: 0.17}
                    kind: equivalence
                    observation: Compare this line with the one before it.
                    hint: How could you check whether the expression still has the same value after this change?
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: The local demo requires a loopback peer and host
        '404':
          description: An assignment or review is unavailable for the demo student
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '415':
          description: Request Content-Type must be application/json
        '502':
          description: Stored review evidence could not be read or validated
        '503':
          description: The submission report could not be saved

  /v1/assessments/rubric/draft:
    post:
      tags: [Assessment Rubrics]
      operationId: draftAssessmentRubric
      summary: Draft a private answer and scoring guide for one question
      description: |
        Loopback-only teacher demo. Drafts answers, lesson alignment and plausible mistakes with OpenAI.
        For Show work, full credit must total the question points and each partial score must fit its full score.
        Send teacher_request and previous to ask for a revision of an existing draft.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentRubricInput'
            example:
              lesson:
                title: Multiplying powers with the same base
                steps: [Expand both powers and count the factors.]
              question:
                kind: showWork
                prompt: Simplify (x²)(x⁵). Show each step.
                points: 1
      responses:
        '200':
          description: Draft for teacher review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentRubricDraft'
        '400':
          description: Invalid JSON, lesson, question or revision request
        '403':
          description: The request did not come from the loopback interface
        '413':
          description: The request exceeds 64 KiB
        '415':
          description: The request needs an application/json content type
        '502':
          description: OpenAI failed to return a valid draft
        '503':
          description: OpenAI is missing from the backend configuration
        '504':
          description: The AI request timed out

  /api/demo/recordings:
    post:
      tags: [Video Replay]
      operationId: uploadReplayRecording
      summary: Upload an MP4 for timestamped transcription
      description: |
        Available on loopback when REPLAY_DEMO_DATABASE_URL is configured. Uploading a draft leaves the
        current publication visible. The video must be an MP4 with H.264 video and AAC audio if present.
        The server selects OpenAI transcription by default when OPENAI_API_KEY is configured. In this mode,
        it extracts audio and splits it at pauses before sending WAV segments
        to gpt-transcribe. Cue timestamps are calculated from each segment's position in the original
        clip. The server returns after saving the draft. Local Whisper mode and an optional prepared
        UTF-8 transcript JSON file are also supported. Cues must have strictly increasing startMs
        and end within the clip duration.
      parameters:
        - $ref: '#/components/parameters/ReplayTeacherRole'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReplayUpload'
            encoding:
              video:
                contentType: video/mp4
              transcript:
                contentType: application/json
      responses:
        '201':
          description: Draft and transcript saved. Use recordingId to publish the clip.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayRecordingRef'
              example:
                recordingId: '8f368301-2f08-4a28-a652-97e07eef40d0'
        '400':
          $ref: '#/components/responses/ReplayInvalidMedia'
        '403':
          $ref: '#/components/responses/ReplayForbidden'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          description: Missing audio track or no transcript generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayError'
              example: {code: invalid_audio, message: คลิปต้องมีแทร็กเสียงสำหรับถอดเสียง}
        '500':
          $ref: '#/components/responses/ReplayFailed'
        '502':
          description: OpenAI transcription failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayError'
              example: {code: transcription_failed, message: บริการถอดเสียงตอบกลับไม่สำเร็จ ลองใหม่อีกครั้ง}
        '503':
          description: No transcription provider is configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayError'
              example: {code: transcription_unavailable, message: ยังไม่ได้ตั้งค่าบริการถอดเสียงบน backend}
        '504':
          description: Transcription exceeded its processing deadline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayError'
              example: {code: transcription_timeout, message: ถอดเสียงเกินเวลา ลองใหม่อีกครั้ง}

  /api/demo/publication:
    put:
      tags: [Video Replay]
      operationId: publishReplayRecording
      summary: Publish a recording to the demo lesson
      description: |
        Publishes the recording together with its transcript. Repeating the request for the current
        recording keeps the same publication. Selecting a different recording replaces the previous
        publication. Maximum JSON request body size is 1 KiB.
      parameters:
        - $ref: '#/components/parameters/ReplayTeacherRole'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplayRecordingRef'
            example:
              recordingId: '8f368301-2f08-4a28-a652-97e07eef40d0'
      responses:
        '200':
          description: The selected recording is published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayRecordingRef'
              example:
                recordingId: '8f368301-2f08-4a28-a652-97e07eef40d0'
        '400':
          description: Malformed JSON, an unknown request field, or missing recordingId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayError'
              examples:
                invalidJson:
                  value: {code: invalid_json, message: expected one JSON object with known fields}
                missingRecording:
                  value: {code: invalid_media, message: เลือกคลิปที่จะเผยแพร่}
        '403':
          $ref: '#/components/responses/ReplayForbidden'
        '404':
          $ref: '#/components/responses/ReplayRecordingNotFound'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '500':
          $ref: '#/components/responses/ReplayFailed'

  /api/demo/replay:
    get:
      tags: [Video Replay]
      operationId: getPublishedReplay
      summary: Read the current published recording and transcript
      description: |
        Returns published false when no recording has been published. When published is true, use
        videoUrl to load the MP4 and startMs to seek to each transcript cue.
      responses:
        '200':
          description: Publication state for the demo lesson
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ReplayUnpublished'
                  - $ref: '#/components/schemas/ReplayPublished'
              examples:
                published:
                  value:
                    published: true
                    videoUrl: /api/demo/recordings/8f368301-2f08-4a28-a652-97e07eef40d0/video
                    recordingId: '8f368301-2f08-4a28-a652-97e07eef40d0'
                    durationMs: 69022
                    transcript:
                      - startMs: 0
                        endMs: 17476
                        text: วันนี้เราจะเรียนเรื่องการคูณเลขยกกำลังที่มีฐานเดียวกัน
                unpublished:
                  value:
                    published: false
        '403':
          $ref: '#/components/responses/ReplayForbidden'
        '500':
          $ref: '#/components/responses/ReplayFailed'

  /api/demo/recordings/{id}/video:
    parameters:
      - $ref: '#/components/parameters/ReplayRecordingId'
      - name: Range
        in: header
        description: Optional HTTP byte range for seeking or resuming playback.
        schema:
          type: string
        example: bytes=0-1023
    get:
      tags: [Video Replay]
      operationId: getPublishedReplayVideo
      summary: Download or seek within the published MP4
      description: The URL is available while its recording is the current publication for the demo lesson.
      responses:
        '200':
          $ref: '#/components/responses/ReplayVideo'
        '206':
          $ref: '#/components/responses/ReplayVideoRange'
        '304':
          description: The file has not been modified since the requested validator
        '403':
          $ref: '#/components/responses/ReplayForbidden'
        '404':
          $ref: '#/components/responses/ReplayRecordingNotFound'
        '416':
          description: Invalid or unsatisfiable byte range
          content:
            text/plain:
              schema: {type: string}
        '500':
          $ref: '#/components/responses/ReplayFailed'
    head:
      tags: [Video Replay]
      operationId: headPublishedReplayVideo
      summary: Read published MP4 headers
      description: Returns the corresponding GET status and headers with an empty response body.
      responses:
        '200':
          description: Headers for the complete MP4
          headers:
            Content-Length:
              description: File size in bytes
              schema: {type: integer, format: int64}
            Accept-Ranges:
              description: Supported range unit
              schema: {type: string, enum: [bytes]}
        '206':
          description: Headers for the requested byte range or ranges
          headers:
            Content-Range:
              description: Byte range and total file size for a single range
              schema: {type: string}
        '304':
          description: The file has not been modified since the requested validator
        '403':
          description: The replay service accepts only loopback hosts
        '404':
          description: Recording is not the current publication or its video file is missing
        '416':
          description: Invalid or unsatisfiable byte range
        '500':
          description: The service could not read the video

  /api/demo/recordings/{id}/preview:
    get:
      tags: [Video Replay]
      operationId: previewReplayRecording
      summary: Preview an uploaded recording as the demo teacher
      description: Plays a valid uploaded clip before or after publication. The preview is served with Cache-Control no-store.
      parameters:
        - $ref: '#/components/parameters/ReplayTeacherRole'
        - name: id
          in: path
          required: true
          description: Recording ID returned by the upload endpoint.
          schema: {type: string, format: uuid}
          example: '8f368301-2f08-4a28-a652-97e07eef40d0'
        - name: Range
          in: header
          description: Optional HTTP byte range for preview playback.
          schema: {type: string}
          example: bytes=0-1023
      responses:
        '200':
          $ref: '#/components/responses/ReplayVideo'
        '206':
          $ref: '#/components/responses/ReplayVideoRange'
        '304':
          description: The file has not been modified since the requested validator
        '403':
          $ref: '#/components/responses/ReplayForbidden'
        '404':
          $ref: '#/components/responses/ReplayRecordingNotFound'
        '416':
          description: Invalid or unsatisfiable byte range
          content:
            text/plain:
              schema: {type: string}
        '500':
          $ref: '#/components/responses/ReplayFailed'

components:
  parameters:
    SyllabusId:
      name: id
      in: path
      required: true
      description: ID from the saved syllabus response
      schema:
        $ref: '#/components/schemas/SyllabusId'
      example: '11112222333344445555666677778888'

    ReplayTeacherRole:
      name: X-Demo-Role
      in: header
      required: true
      description: Selects the teacher role for local demo writes.
      schema:
        type: string
        enum: [teacher]
      example: teacher
    ReplayRecordingId:
      name: id
      in: path
      required: true
      description: ID of the currently published recording.
      schema:
        type: string
        format: uuid
      example: '8f368301-2f08-4a28-a652-97e07eef40d0'

  requestBodies:
    SyllabusEdit:
      required: true
      description: Complete teacher-edited syllabus. Maximum request body size is 512 KiB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SyllabusEdit'
          examples:
            oneClass:
              $ref: '#/components/examples/SyllabusEdit'

  responses:
    BadRequest:
      description: Malformed JSON, an unknown request field, or failed domain validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
          examples:
            invalidJson:
              value: {code: invalid_json, message: expected one JSON object with known fields}
            invalidInput:
              $ref: '#/components/examples/InvalidDraftInput'
    NotFound:
      description: The requested draft or published snapshot does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
          examples:
            missingCourse:
              $ref: '#/components/examples/NotFound'
    RequestTooLarge:
      description: The request body exceeds the endpoint size limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
          example: {code: request_too_large, message: request body is too large}
    CourseFailed:
      description: The service could not complete the course operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
          example: {code: course_failed, message: course operation failed}

    ReplayVideo:
      description: Complete MP4
      headers:
        Accept-Ranges:
          description: Supported range unit
          schema: {type: string, enum: [bytes]}
      content:
        video/mp4:
          schema: {type: string, format: binary}
    ReplayVideoRange:
      description: Requested byte range or ranges
      headers:
        Content-Range:
          description: Byte range and total file size for a single range
          schema: {type: string}
          example: bytes 0-1023/794872
      content:
        video/mp4:
          schema: {type: string, format: binary}
        multipart/byteranges:
          schema: {type: string, format: binary}
    ReplayInvalidMedia:
      description: Missing file part, invalid MP4, or invalid transcript
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReplayError'
          example: {code: invalid_media, message: เลือกไฟล์ MP4}
    ReplayForbidden:
      description: Teacher role required for writes, or the request host is outside loopback
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReplayError'
          example: {code: forbidden, message: เปิดมุมมองครูเพื่อจัดการคลิป}
    ReplayRecordingNotFound:
      description: Recording unavailable for the requested operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReplayError'
          example: {code: recording_not_found, message: ไม่พบคลิป}
    ReplayFailed:
      description: The service could not complete the replay operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReplayError'
          example: {code: replay_error, message: จัดการคลิปไม่สำเร็จ ลองใหม่อีกครั้ง}

  schemas:
    ReplayError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [invalid_json, invalid_media, invalid_audio, forbidden, recording_not_found, replay_error, transcription_failed, transcription_unavailable, transcription_timeout]
        message:
          type: string
    ReplayUpload:
      type: object
      required: [video]
      properties:
        video:
          type: string
          format: binary
          description: MP4 file part with a .mp4 filename. Maximum 50,000,000 bytes.
        transcript:
          type: string
          format: binary
          description: Optional prepared JSON file containing a nonempty array of ReplaySegment objects. Maximum 256 KiB.
    ReplayRecordingRef:
      type: object
      additionalProperties: false
      required: [recordingId]
      properties:
        recordingId:
          type: string
          format: uuid
    ReplaySegment:
      type: object
      additionalProperties: false
      required: [startMs, endMs, text]
      properties:
        startMs:
          type: integer
          minimum: 0
          description: Start offset in milliseconds. Each start is later than the previous cue's start.
        endMs:
          type: integer
          minimum: 1
          description: End offset in milliseconds. It must be later than startMs and within the recording.
        text:
          type: string
          minLength: 1
          description: Cue text. Whitespace-only text is invalid.
    ReplayUnpublished:
      type: object
      required: [published]
      properties:
        published:
          type: boolean
          enum: [false]
    ReplayPublished:
      type: object
      required: [published, videoUrl, recordingId, durationMs, transcript]
      properties:
        published:
          type: boolean
          enum: [true]
        videoUrl:
          type: string
          description: Origin-relative URL of the current MP4.
        recordingId:
          type: string
          format: uuid
        durationMs:
          type: integer
          minimum: 1
        transcript:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ReplaySegment'
    Grade:
      type: integer
      minimum: 1
      maximum: 6
    CourseType:
      type: string
      enum: [core, additional]
    SyllabusId:
      type: string
      pattern: '^[0-9a-f]{32}$'
    Term:
      type: integer
      enum: [1, 2]
    AssessmentRubricInput:
      type: object
      required: [lesson, question]
      properties:
        lesson:
          type: object
          required: [title, steps]
          properties:
            title: {type: string}
            steps:
              type: array
              minItems: 1
              items: {type: string}
        question:
          type: object
          required: [kind, prompt, points]
          properties:
            kind:
              type: string
              enum: [shortAnswer, showWork, multipleChoice, trueFalse]
            prompt: {type: string}
            points: {type: integer, minimum: 1}
            options:
              description: Two to four distinct strings for multiple choice
              type: array
              minItems: 2
              maxItems: 4
              items: {type: string}
        teacher_request: {type: string}
        previous:
          $ref: '#/components/schemas/AssessmentRubricDraft'
    AssessmentRubricDraft:
      type: object
      required: [answer, correct_option, alignment, alignment_reason, criteria, mistakes, note]
      properties:
        answer:
          type: string
          description: Suggested model answer, possibly blank for an ambiguous question
        correct_option:
          type: integer
          nullable: true
          description: Zero-based option index. For trueFalse, 0 is True and 1 is False.
        alignment:
          type: string
          enum: [aligned, out_of_scope, unclear]
        alignment_reason: {type: string}
        criteria:
          type: array
          maxItems: 6
          items:
            type: object
            required: [name, description, full_points, full_description, partial_points, partial_description, none_description]
            properties:
              name: {type: string}
              description: {type: string}
              full_points: {type: number}
              full_description: {type: string}
              partial_points: {type: number, nullable: true}
              partial_description: {type: string}
              none_description: {type: string}
        mistakes:
          type: array
          maxItems: 4
          items:
            type: object
            required: [example, reason]
            properties:
              example: {type: string}
              reason: {type: string}
        note: {type: string}
    APIError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [invalid_json, invalid_input, request_too_large, syllabus_unavailable, model_timeout, invalid_plan, generation_failed, not_found, not_ready, teaching_started, course_failed, forbidden, item_not_found, attempt_closed, unsupported_media_type, invalid_review, review_failed, feedback_unavailable, review_timeout]
        message:
          type: string
    CurriculumSource:
      type: object
      required: [title, file, sha256]
      properties:
        title: {type: string}
        file: {type: string}
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
    LearningOutcome:
      type: object
      required: [number, text]
      properties:
        number: {type: integer, minimum: 1}
        text: {type: string}
        code: {type: string, description: Official indicator code for a core course.}
    CurriculumRow:
      type: object
      required: [id, grade, pdf_page, printed_page, title, outcomes, content]
      properties:
        id: {type: string, description: Curriculum row ID accepted in reference_ids.}
        grade:
          $ref: '#/components/schemas/Grade'
        pdf_page: {type: integer, minimum: 1, description: Page position in the PDF.}
        printed_page: {type: integer, minimum: 1, description: Number printed on the source page.}
        title: {type: string}
        outcomes:
          type: array
          items:
            $ref: '#/components/schemas/LearningOutcome'
        content:
          type: array
          items: {type: string}
    CurriculumStandard:
      type: object
      required: [strand, statement]
      properties:
        strand: {type: string}
        standard_code: {type: string, description: Standard code for a core course.}
        objective_number: {type: integer, minimum: 1, description: Objective number for an additional course.}
        statement: {type: string}
    CurriculumGroup:
      allOf:
        - $ref: '#/components/schemas/CurriculumStandard'
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: '#/components/schemas/CurriculumRow'
    CurriculumReference:
      allOf:
        - $ref: '#/components/schemas/CurriculumStandard'
        - type: object
          required: [row]
          properties:
            row:
              $ref: '#/components/schemas/CurriculumRow'
    CurriculumSelection:
      type: object
      required: [source, grade, course_type, groups]
      properties:
        source:
          $ref: '#/components/schemas/CurriculumSource'
        grade:
          $ref: '#/components/schemas/Grade'
        course_type:
          $ref: '#/components/schemas/CourseType'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/CurriculumGroup'
    AssessmentWeight:
      type: object
      required: [category, points]
      properties:
        category: {type: string, minLength: 1, description: Category name in English.}
        points: {type: integer, minimum: 1, maximum: 100}
    SyllabusInput:
      type: object
      required: [course_name, grade, course_type, term, total_sessions, minutes_per_session, reference_ids]
      properties:
        course_name: {type: string, minLength: 1, description: Course name in English.}
        course_code: {type: string, description: Optional school course identifier.}
        grade:
          $ref: '#/components/schemas/Grade'
        course_type:
          $ref: '#/components/schemas/CourseType'
        term:
          $ref: '#/components/schemas/Term'
        total_sessions: {type: integer, minimum: 1, maximum: 1000}
        minutes_per_session: {type: integer, minimum: 1, maximum: 1439}
        reference_ids:
          type: array
          minItems: 1
          uniqueItems: true
          description: Rows selected for this semester from the specified grade and course type.
          items: {type: string}
        assessment_weights:
          type: array
          nullable: true
          description: If nonempty, use unique category names and a combined total of 100 points.
          items:
            $ref: '#/components/schemas/AssessmentWeight'
    Assessment:
      type: object
      required: [title, category, session, points]
      properties:
        title: {type: string, minLength: 1, description: Assessment title in English.}
        category: {type: string, description: Exact category name from assessment_weights.}
        session:
          type: integer
          minimum: 1
          description: One-based unit period in a plan request. One-based course period in responses.
        points: {type: integer, minimum: 1, maximum: 100}
    PlannedUnit:
      type: object
      required: [title, reference_ids, session_titles]
      properties:
        title: {type: string, minLength: 1, description: Unit title in English.}
        reference_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string}
        session_titles:
          type: array
          minItems: 1
          items: {type: string, minLength: 1}
        assessments:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/Assessment'
    EditedPlan:
      type: object
      required: [description, units]
      description: |
        Assign each course reference to exactly one unit. The total number of session titles must match
        total_sessions. Each assessment category's total must match its requested weight.
      properties:
        description: {type: string, minLength: 1, description: Course description in English.}
        units:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PlannedUnit'
    NumberedSession:
      type: object
      required: [number, title]
      properties:
        number: {type: integer, minimum: 1}
        title: {type: string}
    SyllabusUnit:
      type: object
      required: [title, reference_ids, sessions, assessments]
      properties:
        title: {type: string}
        reference_ids:
          type: array
          items: {type: string}
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/NumberedSession'
        assessments:
          type: array
          items:
            $ref: '#/components/schemas/Assessment'
    SyllabusDraft:
      allOf:
        - $ref: '#/components/schemas/SyllabusInput'
        - type: object
          required: [course_code, assessment_weights, source, references, description, units, document_html]
          properties:
            planning_mode:
              type: string
              enum: [curriculum, openai, manual]
            source:
              $ref: '#/components/schemas/CurriculumSource'
            references:
              type: array
              description: English translations with the source IDs, codes and page numbers.
              items:
                $ref: '#/components/schemas/CurriculumReference'
            description: {type: string}
            units:
              type: array
              items:
                $ref: '#/components/schemas/SyllabusUnit'
            document_html:
              type: string
              description: Complete student-facing English syllabus document, with dates if present.
    ClockTime:
      type: string
      description: Time in Bangkok in HH:MM format.
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
    WeeklySlot:
      type: object
      required: [weekday, start_time]
      properties:
        weekday: {type: integer, minimum: 1, maximum: 7, description: 1 is Monday and 7 is Sunday.}
        start_time:
          $ref: '#/components/schemas/ClockTime'
    ClassTimetable:
      type: object
      required: [id, slots]
      properties:
        id: {type: string, minLength: 1}
        slots:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WeeklySlot'
    Timetable:
      type: object
      required: [start_date, end_date, classes]
      description: The date range is inclusive and shorter than one year. Weekly time slots must not overlap across classes.
      properties:
        start_date: {type: string, format: date}
        end_date: {type: string, format: date}
        excluded_dates:
          type: array
          nullable: true
          description: Dates skipped across all classes.
          items: {type: string, format: date}
        classes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ClassTimetable'
    AvailabilityInput:
      type: object
      required: [minutes_per_session, timetable]
      properties:
        minutes_per_session: {type: integer, minimum: 1, maximum: 1439}
        timetable:
          $ref: '#/components/schemas/Timetable'
    ClassAvailability:
      type: object
      required: [class_id, available_sessions]
      properties:
        class_id: {type: string}
        available_sessions: {type: integer, minimum: 0}
    Availability:
      type: object
      required: [available_sessions, classes]
      properties:
        available_sessions: {type: integer, minimum: 0}
        classes:
          type: array
          items:
            $ref: '#/components/schemas/ClassAvailability'
    ScheduleMeeting:
      type: object
      required: [session, unit, title, date, start_time, end_time, assessments]
      properties:
        session: {type: integer, minimum: 1}
        unit: {type: string}
        title: {type: string}
        date: {type: string, format: date}
        start_time:
          $ref: '#/components/schemas/ClockTime'
        end_time:
          $ref: '#/components/schemas/ClockTime'
        assessments:
          type: array
          items:
            $ref: '#/components/schemas/Assessment'
    ClassSchedule:
      allOf:
        - $ref: '#/components/schemas/ClassAvailability'
        - type: object
          required: [meetings]
          properties:
            meetings:
              type: array
              items:
                $ref: '#/components/schemas/ScheduleMeeting'
    TeachingSchedule:
      type: object
      required: [timezone, available_sessions, classes]
      properties:
        timezone: {type: string, enum: [Asia/Bangkok]}
        available_sessions: {type: integer, minimum: 0}
        classes:
          type: array
          items:
            $ref: '#/components/schemas/ClassSchedule'
    SyllabusEdit:
      type: object
      required: [course, plan]
      properties:
        course:
          $ref: '#/components/schemas/SyllabusInput'
        plan:
          $ref: '#/components/schemas/EditedPlan'
        timetable:
          $ref: '#/components/schemas/Timetable'
    SyllabusPreview:
      type: object
      required: [syllabus]
      description: Timetable and schedule are returned when the request included a timetable.
      properties:
        syllabus:
          $ref: '#/components/schemas/SyllabusDraft'
        timetable:
          $ref: '#/components/schemas/Timetable'
        schedule:
          $ref: '#/components/schemas/TeachingSchedule'
    SavedSyllabus:
      allOf:
        - $ref: '#/components/schemas/SyllabusPreview'
        - type: object
          required: [id, status]
          properties:
            id:
              $ref: '#/components/schemas/SyllabusId'
            status:
              type: string
              enum: [draft, published, unpublished_changes]
    StudentSyllabus:
      type: object
      required: [id, course_name, grade, term, assessment_weights, schedule]
      properties:
        id:
          $ref: '#/components/schemas/SyllabusId'
        course_name: {type: string}
        course_code: {type: string}
        grade:
          $ref: '#/components/schemas/Grade'
        term:
          $ref: '#/components/schemas/Term'
        assessment_weights:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentWeight'
        schedule:
          $ref: '#/components/schemas/TeachingSchedule'

    OCRBox:
      type: object
      additionalProperties: false
      required: [x, y, width, height]
      description: Normalized coordinates on the submitted image, with the origin at the top left. The entire rectangle fits within the image.
      properties:
        x: {type: number, minimum: 0, maximum: 1}
        y: {type: number, minimum: 0, maximum: 1}
        width: {type: number, minimum: 0, exclusiveMinimum: true, maximum: 1}
        height: {type: number, minimum: 0, exclusiveMinimum: true, maximum: 1}
    OCRBlock:
      type: object
      additionalProperties: false
      required: [id, text, box]
      properties:
        id: {type: string, minLength: 1, maxLength: 128, description: ID unique within the request.}
        text: {type: string, minLength: 1, description: 'OCR text for this line, up to 2048 UTF-8 bytes.'}
        box:
          $ref: '#/components/schemas/OCRBox'
    AssignmentReviewInput:
      type: object
      additionalProperties: false
      description: Submit OCR text, positioned OCR blocks or an image. In OpenAI mode image-only input can also produce highlights.
      anyOf:
        - required: [text]
          properties:
            text: {minLength: 1}
        - required: [blocks]
          properties:
            blocks: {minItems: 1}
        - required: [image_data_url]
      properties:
        text: {type: string, description: 'OCR transcript or typed work, up to 32768 UTF-8 bytes.'}
        blocks:
          type: array
          maxItems: 100
          description: OCR blocks in reading order.
          items:
            $ref: '#/components/schemas/OCRBlock'
        image_data_url:
          type: string
          description: Optional data URL for a Base64 JPEG or PNG. Maximum decoded size 3 MiB and maximum dimensions 4096 × 4096.
          pattern: '^data:image/(jpeg|png);base64,'
        focused_block_id:
          type: string
          description: ID of an OCR block the student circled or selected.
        language:
          type: string
          enum: [en, th]
          default: en
    AssignmentReviewIssue:
      type: object
      required: [block_id, box, kind, observation, hint]
      properties:
        block_id: {type: string, description: OCR block ID from the client or generated by the backend.}
        box:
          $ref: '#/components/schemas/OCRBox'
        kind:
          type: string
          enum: [same_base_powers, sign, distribution, arithmetic, equivalence, missing_step, units, incomplete]
