name: promptlearn
description: "PromptLearn supports the teaching and learning cycle for teachers and students."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  flutter_svg: ^2.0.16
  intl: ^0.20.2
  shared_preferences: ^2.5.6
  web: ^1.1.1
  chucker_flutter: ^1.9.2
  share_plus: ^12.0.2
  http: ^1.6.0
  video_player: ^2.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  video_player_platform_interface: ^6.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/navigation/
    - assets/home/
    - assets/student_home/
    - assets/assessment/
    - assets/assistant/
    - assets/classroom/
    - assets/syllabus/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: Noto Sans Thai
      fonts:
        - asset: assets/fonts/NotoSansThai-Variable.ttf
